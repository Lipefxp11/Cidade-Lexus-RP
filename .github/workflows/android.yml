name: Cidade Lexus Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz

          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          mkdir -p /tmp/godot-templates

          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/4.4.1.stable/

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Cidade Lexus,O=Development,C=BR"

      - name: Configure Android export
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path

          home = Path.home()
          sdk = os.environ["ANDROID_HOME"]
          java = os.environ["JAVA_HOME"]

          config = home / ".config/godot/editor_settings-4.4.tres"
          config.parent.mkdir(parents=True, exist_ok=True)

          config.write_text(
              '[gd_resource type="EditorSettings" format=3]\n'
              '\n'
              '[resource]\n'
              f'export/android/android_sdk_path = "{sdk}"\n'
              f'export/android/java_sdk_path = "{java}"\n'
              f'export/android/debug_keystore = "{home}/debug.keystore"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n'
          )

          print("Android SDK:", sdk)
          print("Java SDK:", java)
          print("Keystore:", (home / "debug.keystore").exists())
          PYCODE

      - name: Diagnose Android export
        run: |
          echo "===== GODOT ====="
          godot --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed

          echo "===== JAVA ====="
          java -version

          echo "===== KEYSTORE ====="
          test -f "$HOME/debug.keystore" && echo "Keystore OK"

          echo "===== EXPORT PRESET ====="
          python3 - <<'PYCODE'
          from pathlib import Path

          for line in Path("export_presets.cfg").read_text().splitlines():
              if line.startswith(("name=", "platform=", "package/unique_name=")):
                  print(line)
              elif line.startswith("keystore/debug"):
                  key, _, value = line.partition("=")
                  print(f"{key}={'CONFIGURADO' if value.strip() not in ('', chr(34) * 2) else 'VAZIO'}")
          PYCODE

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --verbose --path . --export-debug Android build/CidadeLexus-debug.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CidadeLexus-Android
          path: build/*.apk
          if-no-files-found: warn
