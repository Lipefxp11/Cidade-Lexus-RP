name: Cidade Lexus RP V22 - Android Multiplayer Cliente

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Use the Android SDK preinstalled on GitHub-hosted Ubuntu.
      # Avoid setup-android@v3 attempting to install a nonexistent package named tools.
      - name: Install Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Install Godot 4.4.1 and Android templates
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" /tmp/lexus-templates
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/lexus-templates
          cp /tmp/lexus-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Create debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/lexus-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Cidade Lexus,O=Development,C=BR'
      - name: V18 static project validation
        run: |
          python3 tests/v18_static_check.py
      - name: Verify V22 multiplayer scripts and Android Internet permission
        run: |
          python3 tests/v22_multiplayer_static.py
      - name: Test Discloud protocol validators (Node built-ins)
        run: |
          node --check server_discloud/index.js
          node --test server_discloud/tests/*.test.js
      - name: Verify landscape settings and script syntax
        run: |
          set -e
          mkdir -p build/logs
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          config = Path('project.godot').read_text()
          assert 'window/handheld/orientation=0' in config, 'O projeto nao esta em landscape'
          assert 'window/size/viewport_width=1280' in config
          assert 'window/size/viewport_height=720' in config
          assert not list(Path('scripts').rglob('*.gd')) == [], 'Scripts nao encontrados'
          assert 'pointing/emulate_mouse_from_touch=true' in config, 'Botao Android requer touch mouse emulation'
          for script in Path('scripts').rglob('*.gd'):
              text = script.read_text()
              if re.search(r'(?m)^\s*const\s+\w+\s*:=', text):
                  raise SystemExit('Sintaxe incorreta de constante: ' + str(script))
          print('Configuracao horizontal e verificacoes basicas: OK')
          PYCODE
          set -o pipefail
          godot --headless --path . --check-only --script res://scripts/main.gd 2>&1 | tee build/logs/script_check.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Cannot infer the type|Invalid (set|get|call)' build/logs/script_check.log; then
            echo 'Foi encontrado erro de parser GDScript. Veja script_check.log.'
            exit 1
          fi
      - name: Confirm self-contained official character
        run: |
          set -e
          test -s assets/models/character.glb
          python3 tests/v20_static_check.py
      - name: Validate three-city map and weather V21
        run: |
          python3 tests/v21_static_check.py
      - name: Import Godot project
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee build/logs/editor_import.log
      - name: Smoke test V22 WebSocket client state
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v22_network_smoke.gd 2>&1 | tee build/logs/v22_network_smoke.log
          if grep -Eiq 'V22 NETWORK ERROR|SCRIPT ERROR|Parse Error|Failed to load script|Invalid call' build/logs/v22_network_smoke.log; then
            exit 1
          fi
      - name: Verify interactive menu actions
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/ui_signal_smoke.gd 2>&1 | tee build/logs/menu_input_smoke.log
      - name: Smoke test fire and voice UI signals
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v16_input_smoke.gd 2>&1 | tee build/logs/v16_input_smoke.log
      - name: V20 character customization and GPS smoke test
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v20_avatar_gps_smoke.gd 2>&1 | tee build/logs/v20_avatar_gps_smoke.log
          if grep -Eiq 'V20 SMOKE ERROR|SCRIPT ERROR|Parse Error|Failed to load script' build/logs/v20_avatar_gps_smoke.log; then
            echo 'V20 character or GPS smoke failed. Inspect v20_avatar_gps_smoke.log.'
            exit 1
          fi
      - name: Validate Lexus official 3D character
        run: |
          set -o pipefail
          test -s assets/models/character.glb
          godot --headless --path . --script res://tests/v17_character_smoke.gd 2>&1 | tee build/logs/v17_character.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|V17 character:' build/logs/v17_character.log; then
            echo 'O modelo oficial nao carregou corretamente. Verifique v17_character.log.'
            exit 1
          fi
      - name: Validate V23 playable protagonist model
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v23_character_smoke.gd 2>&1 | tee build/logs/v23_character_smoke.log
          if grep -Eiq 'V23 ERROR|SCRIPT ERROR|Parse Error|Failed to load script|Invalid call' build/logs/v23_character_smoke.log; then
            exit 1
          fi
      - name: Validate V18 favela, vehicle and interaction systems
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v18_system_smoke.gd 2>&1 | tee build/logs/v18_system_smoke.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|V18 SYSTEM ERROR|Failed to load script' build/logs/v18_system_smoke.log; then
            echo 'V18 systems failed smoke test.'
            exit 1
          fi
      - name: Smoke test V21 bridge, tunnel, water, climate and minimap
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/v21_world_smoke.gd 2>&1 | tee build/logs/v21_world_smoke.log
          if grep -Eiq 'V21 WORLD ERROR|SCRIPT ERROR|Parse Error|Failed to load script|Invalid call' build/logs/v21_world_smoke.log; then
            echo 'V21 world or climate smoke failed. Inspect log.'
            exit 1
          fi
      - name: Smoke test boot menu (headless)
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 90 2>&1 | tee build/logs/startup.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Cannot infer the type' build/logs/startup.log; then
            echo 'Erro de script detectado. Consulte os logs anexados.'
            exit 1
          fi
      - name: Configure export after editor initialization
        env:
          LEXUS_KEYSTORE: ${{ runner.temp }}/lexus-debug.keystore
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import re
          sdk = os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']
          java = os.environ['JAVA_HOME']
          config = Path.home() / '.config/godot/editor_settings-4.4.tres'
          config.parent.mkdir(parents=True, exist_ok=True)
          content = config.read_text() if config.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          settings = {
              'export/android/android_sdk_path': sdk,
              'export/android/java_sdk_path': java,
              'export/android/debug_keystore': os.environ['LEXUS_KEYSTORE'],
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in settings.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, content):
                  content = re.sub(pattern, lambda _: line, content)
              else:
                  content += '\n' + line + '\n'
          config.write_text(content)
          preset = Path('export_presets.cfg')
          data = preset.read_text()
          for key, value in {'keystore/debug':os.environ['LEXUS_KEYSTORE'], 'keystore/debug_user':'androiddebugkey', 'keystore/debug_password':'android'}.items():
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              line = f'{key}="{value}"'
              data = re.sub(pattern, lambda _: line, data) if re.search(pattern,data) else data+'\n'+line
          preset.write_text(data)
          assert Path(sdk).is_dir(), 'Android SDK missing'
          assert Path(java).is_dir(), 'Java SDK missing'
          assert Path(os.environ['LEXUS_KEYSTORE']).is_file(), 'Keystore missing'
          print('SDK, JDK, keystore and preset configured')
          print('SDK:', sdk, 'JAVA:', java)
          PYCODE
      - name: Check Android configuration
        run: |
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'export/android/android_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'keystore/debug=' export_presets.cfg | sed 's@=.*@=CONFIGURADO@'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --verbose --path . --export-debug Android build/CidadeLexus-V22-debug.apk
          test -s build/CidadeLexus-V22-debug.apk
      - name: Upload Godot diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CidadeLexus-V22-logs
          path: build/logs/*.log
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CidadeLexus-V22-Android-APK
          path: build/CidadeLexus-V22-debug.apk
          if-no-files-found: error
