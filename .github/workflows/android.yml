name: Cidade Lexus RP - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Use the Android SDK preinstalled on GitHub-hosted Ubuntu.
      # Avoid setup-android@v3 attempting to install a nonexistent package named tools.
      - name: Install Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Install Godot 4.4.1 and Android templates
        run: |
          set -e
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          sudo install -m 755 Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" /tmp/lexus-templates
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/lexus-templates
          cp /tmp/lexus-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Create debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/lexus-debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Cidade Lexus,O=Development,C=BR'
      - name: Import Godot project
        run: godot --headless --path . --editor --quit
      - name: Configure export after editor initialization
        env:
          LEXUS_KEYSTORE: ${{ runner.temp }}/lexus-debug.keystore
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import re
          sdk = os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT']
          java = os.environ['JAVA_HOME']
          config = Path.home() / '.config/godot/editor_settings-4.4.tres'
          config.parent.mkdir(parents=True, exist_ok=True)
          content = config.read_text() if config.exists() else '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          settings = {
              'export/android/android_sdk_path': sdk,
              'export/android/java_sdk_path': java,
              'export/android/debug_keystore': os.environ['LEXUS_KEYSTORE'],
              'export/android/debug_keystore_user': 'androiddebugkey',
              'export/android/debug_keystore_pass': 'android',
          }
          for key, value in settings.items():
              line = f'{key} = "{value}"'
              pattern = rf'(?m)^{re.escape(key)}\s*=.*$'
              if re.search(pattern, content):
                  content = re.sub(pattern, lambda _: line, content)
              else:
                  content += '\n' + line + '\n'
          config.write_text(content)
          preset = Path('export_presets.cfg')
          data = preset.read_text()
          for key, value in {'keystore/debug':os.environ['LEXUS_KEYSTORE'], 'keystore/debug_user':'androiddebugkey', 'keystore/debug_password':'android'}.items():
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              line = f'{key}="{value}"'
              data = re.sub(pattern, lambda _: line, data) if re.search(pattern,data) else data+'\n'+line
          preset.write_text(data)
          assert Path(sdk).is_dir(), 'Android SDK missing'
          assert Path(java).is_dir(), 'Java SDK missing'
          assert Path(os.environ['LEXUS_KEYSTORE']).is_file(), 'Keystore missing'
          print('SDK, JDK, keystore and preset configured')
          print('SDK:', sdk, 'JAVA:', java)
          PYCODE
      - name: Check Android configuration
        run: |
          test -f "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'export/android/android_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'export/android/java_sdk_path' "$HOME/.config/godot/editor_settings-4.4.tres"
          grep 'keystore/debug=' export_presets.cfg | sed 's@=.*@=CONFIGURADO@'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --verbose --path . --export-debug Android build/CidadeLexus-debug.apk
          test -s build/CidadeLexus-debug.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CidadeLexus-V001-Android-APK
          path: build/CidadeLexus-debug.apk
          if-no-files-found: error
